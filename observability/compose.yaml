services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.123.0}
    profiles: [traces, metrics, observability]
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 144MiB
    networks: [backend]

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.8.3}
    profiles: [logs, observability]
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-mlops-initial}
      GOMEMLIMIT: 144MiB
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    mem_limit: 192m
    networks: [backend]

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.4.2}
    profiles: [logs, observability]
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
    healthcheck:
      test: [CMD, /busybox/wget, -q, -O, /dev/null, http://127.0.0.1:3100/ready]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks: [backend]

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.7.2}
    profiles: [traces, observability]
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    mem_limit: 320m
    environment:
      GOMEMLIMIT: 240MiB
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3200/ready]
      interval: 10s
      timeout: 3s
      retries: 15
    networks: [backend]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.2.1}
    profiles: [metrics, observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 144MiB
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.6.0}
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-mlops-local-grafana}
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DATABASE_WAL: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      GOMEMLIMIT: 192MiB
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

volumes:
  alloy_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:

networks:
  backend:
