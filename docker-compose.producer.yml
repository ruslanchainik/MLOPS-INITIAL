name: mlops-producer
services:
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "127.0.0.1:${PRODUCER_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${PRODUCER_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - rabbitmq_producer_data:/var/lib/rabbitmq

volumes:
  rabbitmq_producer_data:
